name: JR East official URL batch research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jreast-url-batch.yml'
      - 'scripts/collect-jreast-batch.py'
      - 'scripts/discover-jreast-index.py'
      - 'scripts/collect-jreast-search-index.py'
permissions:
  contents: read
jobs:
  collect-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests==2.32.3' 'beautifulsoup4==4.12.3' 'pypdf==5.4.0'
      - name: Collect up to 400 search index queries for timetable URLs
        run: python scripts/collect-jreast-search-index.py
      - name: Discover official timetable listing indexes
        run: python scripts/discover-jreast-index.py
      - name: Collect official JR East station roster PDF
        run: python scripts/collect-jreast-pdf.py
      - name: Verify all 1007 stations against independently confirmed URL candidates
        if: always()
        run: |
          node scripts/verify-jreast-urls.cjs research/jreast_missing_snapshot_20261017.json jreast-batch-results/pdf-candidates.json jreast-batch-results/jreast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jreast-official-match-results
          path: jreast-batch-results/
          retention-days: 14
