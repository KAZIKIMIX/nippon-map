name: JR East official route collector
on:
  workflow_dispatch:
    inputs:
      route_ids:
        description: 'Comma-separated official route IDs (blank: 1-120)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Collect official station directory (dry run)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JREAST_ROUTE_IDS: ${{ inputs.route_ids }}
          JREAST_DRY_RUN: 'true'
        run: python scripts/collect-jreast-batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jreast-route-collection
          path: jreast-batch-results/
          if-no-files-found: warn
          retention-days: 14
