name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run check:types
      - name: Map contracts
        run: npm run check:map
      - name: Interaction contracts
        run: npm run check:interactions
      - name: Responsive contracts
        run: npm run check:responsive
      - name: Guide regions
        run: npm run check:regions
      - name: SEO contracts
        run: npm run check:seo
      - name: Production build
        run: npm run build
