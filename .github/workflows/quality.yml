name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Functional unit tests
        run: node --test tests/*.test.cjs
      - name: Map data checks
        run: npm run check:map
      - name: Guide region checks
        run: npm run check:regions
      - name: Interaction regression checks
        run: npm run check:interactions
      - name: Responsive layout checks
        run: npm run check:responsive
      - name: SEO routing checks
        run: npm run check:seo-routing
      - name: Landing experience checks
        run: npm run check:landing
      - name: Search pagination checks
        run: npm run check:search
      - name: TypeScript checks
        run: npm run check:types
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  smoke:
    permissions:
      contents: read
      statuses: read
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Wait for the matching Vercel deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..36}; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '.statuses | map(select(.context == "Vercel")) | .[0].state // "pending"')"
            if [ "$state" = "success" ]; then
              echo "Matching Vercel deployment completed."
              break
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Matching Vercel deployment failed: $state"
              exit 1
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Matching Vercel deployment did not complete within the wait limit."
              exit 1
            fi
            sleep 10
          done
      - name: Report matching deployment statuses on failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Commit: $GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '{state, statuses: [.statuses[] | {context, state, description, target_url}]}' || true
      - name: Production smoke tests
        run: npm run check:production
      - name: Production SEO checks
        run: npm run check:seo
