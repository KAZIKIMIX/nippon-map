name: Production health and SEO
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-health.yml'
      - 'scripts/smoke-production.cjs'
      - 'scripts/check-production-seo.cjs'
      - 'scripts/check-production-latency.cjs'
      - 'components/MapApp.tsx'
      - 'app/api/**'
      - 'app/guides/**'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'next.config.mjs'
      - 'package.json'
      - 'scripts/check-map-interactions.cjs'
      - 'scripts/check-responsive-contract.cjs'
      - 'scripts/check-search-pagination.cjs'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
  statuses: read
concurrency:
  group: production-health
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Wait for the matching Vercel deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..36}; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '.statuses | map(select(.context == "Vercel")) | .[0].state // "pending"')"
            if [ "$state" = "success" ]; then
              echo "Matching Vercel deployment completed."
              break
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Matching Vercel deployment failed: $state"
              exit 1
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Matching Vercel deployment did not complete within the wait limit."
              exit 1
            fi
            sleep 10
          done
      - name: Report matching deployment statuses on failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Commit: $GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '{state, statuses: [.statuses[] | {context, state, description, target_url}]}' || true
      - name: Check map interaction, responsive and search contracts
        run: |
          npm run check:interactions
          npm run check:responsive
          npm run check:search
      - name: Check public API, map, guides and sitemap
        run: npm run check:production
      - name: Check sitemap URLs, canonical and structured data
        run: npm run check:seo
      - name: Record API latency and cache headers
        if: always()
        continue-on-error: true
        run: node scripts/check-production-latency.cjs
