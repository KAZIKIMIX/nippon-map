name: Temporary privacy and terms HTTP check
on:
  push:
    branches:
      - verify/http-privacy-terms-20261018
permissions:
  contents: read
jobs:
  http-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check only privacy and terms status codes
        shell: bash
        run: |
          set -euo pipefail
          for path in privacy terms; do
            status="$(curl --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://nippon-map.vercel.app/$path")"
            echo "HTTP_RESULT $path $status"
            test "$status" = "200"
          done
