name: Map desktop and mobile verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --package-lock=false
      - name: Static map and responsive checks
        run: |
          npm run check:interactions
          npm run check:responsive
          npm run check:types
      - name: Install Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Wait for the matching Vercel deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..36}; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '.statuses | map(select(.context == "Vercel")) | .[0].state // "pending"')"
            if [ "$state" = "success" ]; then
              echo "Matching Vercel deployment completed."
              break
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Matching Vercel deployment failed: $state"
              exit 1
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Matching Vercel deployment did not complete within the wait limit."
              exit 1
            fi
            sleep 10
          done
      - name: Desktop and mobile production smoke
        run: node scripts/check-live-map.cjs
      - name: Shared map desktop and mobile restoration
        run: node scripts/check-shared-map-live.cjs
      - name: Upload browser verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: map-verification-results
          path: test-results/
          if-no-files-found: ignore

